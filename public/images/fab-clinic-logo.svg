<svg xmlns="http://www.w3.org/2000/svg" width="840" height="180" viewBox="0 0 840 180" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">FAB CLINIC logo</title>
  <desc id="logoDesc">Elegant wordmark on textured cream paper with gold-leaf divider line.</desc>

  <defs>
    <!-- Paper grain texture -->
    <filter id="paperGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="5" seed="2" stitchTiles="stitch" result="grain"/>
      <feColorMatrix type="saturate" values="0" in="grain" result="grainBW"/>
      <feComponentTransfer in="grainBW" result="softGrain">
        <feFuncA type="linear" slope="0.08"/>
      </feComponentTransfer>
      <feFlood flood-color="#f5f0e8" result="cream"/>
      <feMerge>
        <feMergeNode in="cream"/>
        <feMergeNode in="softGrain"/>
      </feMerge>
    </filter>

    <!-- Subtle emboss for text -->
    <filter id="textEmboss" x="-2%" y="-2%" width="104%" height="104%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.6" result="blur"/>
      <feOffset dx="0.4" dy="0.4" in="blur" result="offsetBlur"/>
      <feFlood flood-color="#1a0f08" flood-opacity="0.15" result="shadow"/>
      <feComposite in="shadow" in2="offsetBlur" operator="in" result="textShadow"/>
      <feMerge>
        <feMergeNode in="textShadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gold-leaf texture for the line -->
    <filter id="goldLeaf" x="-5%" y="-100%" width="110%" height="400%">
      <feTurbulence type="fractalNoise" baseFrequency="1.2 0.8" numOctaves="4" seed="7" result="noise"/>
      <feColorMatrix type="matrix" in="noise" result="goldNoise"
        values="0.3 0 0 0 0.78
                0.3 0 0 0 0.65
                0.1 0 0 0 0.36
                0   0 0 0.35 0"/>
      <feComposite in="goldNoise" in2="SourceGraphic" operator="in" result="noiseMasked"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.5" result="glow"/>
      <feFlood flood-color="#d4af57" flood-opacity="0.3" result="glowColor"/>
      <feComposite in="glowColor" in2="glow" operator="in" result="softGlow"/>
      <feMerge>
        <feMergeNode in="softGlow"/>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="noiseMasked"/>
      </feMerge>
    </filter>

    <!-- Gold gradient with warm variation -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#b8943e"/>
      <stop offset="12%"  stop-color="#d4af57"/>
      <stop offset="30%"  stop-color="#e8c96a"/>
      <stop offset="45%"  stop-color="#c6a04d"/>
      <stop offset="58%"  stop-color="#dabb5e"/>
      <stop offset="75%"  stop-color="#c9a44f"/>
      <stop offset="88%"  stop-color="#d9b85c"/>
      <stop offset="100%" stop-color="#b8943e"/>
    </linearGradient>
  </defs>

  <!-- Textured cream paper background -->
  <rect width="840" height="180" filter="url(#paperGrain)"/>

  <!-- Main text with subtle emboss -->
  <text x="420" y="104" text-anchor="middle"
        font-family="'Playfair Display', 'Georgia', 'Times New Roman', serif"
        font-size="96" font-weight="500" letter-spacing="12" fill="#2d1a10"
        filter="url(#textEmboss)">
    FAB CLINIC
  </text>

  <!-- Gold-leaf line -->
  <line x1="48" y1="144" x2="792" y2="144"
        stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"
        filter="url(#goldLeaf)"/>

  <!-- Secondary shimmer highlight on gold line -->
  <line x1="200" y1="143.5" x2="640" y2="143.5"
        stroke="#e8d48a" stroke-width="0.5" stroke-linecap="round" opacity="0.35"/>
</svg>
